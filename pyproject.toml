[project]
name = "epo"
version = "0.1.0"
description = "Prévision des prix day-ahead belges et pilotage de batterie"
requires-python = ">=3.11"
dependencies = [
    "entsoe-py",
    "pandas",
    "pyarrow",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]